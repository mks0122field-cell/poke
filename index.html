<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>練習</title>
    <link rel="stylesheet" href="style.css">
    <script src="pokelist.js"defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="search_area">
        <input type="textbox" placeholder="図鑑番号を入れて" id="texttype">
        <button id="submitBtn">検索</button>
    </div>

    <div id="container">
        <div id="poke_name"></div>
  


        <div class="poke_info">
            <div id="poke_img"></div>

            <div id="poke_details">
                <div class="detail_row">
                    <span>タイプ</span>
                    <div id="poke_types"></div>
                </div>
                <div class="detail_row">
                    <span>高さ</span>
                    <div id="poke_height"></div>
                </div>
                <div class="detail_row">
                    <span>重さ</span>
                    <div id="poke_weight"></div>
                </div>
                <div class="detail_row">
                    <span>特性</span>
                    <div id="poke_abilities"></div> 






                    





                </div>
            </div>
        
        </div>
    </div>



</body>

</html
